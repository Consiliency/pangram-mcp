[project]
name = "pangram-mcp"
version = "0.1.3"
description = "MCP server for Pangram Labs AI-generated-text detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Consiliency" }]
keywords = ["mcp", "model-context-protocol", "pangram", "ai-detection", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # BOTH bounds are load-bearing; both were verified by installing each version
    # and importing pangram_mcp.server.
    #
    # Upper: mcp 2.0.0 REMOVED mcp.server.fastmcp (not a rename — 2.x exposes a
    # different mcpserver API) and server.py imports FastMCP at module scope.
    # Raising it requires porting server.py off FastMCP.
    #
    # Lower: 1.14.0 is the oldest release this server actually runs on. Below it
    # there are two distinct failures — <1.7.0 lacks mcp.types.ToolAnnotations,
    # and 1.7.0–1.13.1 raise TypeError inside FastMCP's own tool registration
    # (Tool.from_function -> issubclass(param.annotation, Context)). Do not lower
    # this to "when ToolAnnotations first appeared"; that is 1.7.0 and it is
    # still broken.
    "mcp>=1.14.0,<2.0.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/Consiliency/pangram-mcp"
Homepage = "https://github.com/Consiliency/pangram-mcp"
Issues = "https://github.com/Consiliency/pangram-mcp/issues"

[project.scripts]
pangram-mcp = "pangram_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pangram_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
