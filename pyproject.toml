[project]
name = "pangram-mcp"
version = "0.1.2"
description = "MCP server for Pangram Labs AI-generated-text detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Consiliency" }]
keywords = ["mcp", "model-context-protocol", "pangram", "ai-detection", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 REMOVED mcp.server.fastmcp (it is
    # not a rename — 2.x replaces it with a different mcpserver API), and
    # server.py imports FastMCP from it at module scope. Without the cap a fresh
    # `uvx pangram-mcp` resolves to 2.x and the server dies before starting.
    # Raising this requires porting server.py off FastMCP.
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/Consiliency/pangram-mcp"
Homepage = "https://github.com/Consiliency/pangram-mcp"
Issues = "https://github.com/Consiliency/pangram-mcp/issues"

[project.scripts]
pangram-mcp = "pangram_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pangram_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
