[project]
name = "pangram-mcp"
version = "0.1.4"
description = "MCP server for Pangram Labs AI-generated-text detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Consiliency" }]
keywords = ["mcp", "model-context-protocol", "pangram", "ai-detection", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # BOTH bounds are load-bearing; both were established by installing each
    # boundary version and importing pangram_mcp.server, not by reading source.
    #
    # Lower: 2.0.0 is the oldest release exposing mcp.server.MCPServer, which
    # server.py now imports. mcp.server.fastmcp.FastMCP (the pre-2.0 API this
    # server used through 0.1.3) was REMOVED in 2.0.0 — not renamed — so no 1.x
    # release satisfies this floor; installing mcp==1.29.0 (the last 1.x) and
    # importing mcp.server.MCPServer raises ImportError.
    #
    # Upper: only mcp 2.0.0 is a stable release on PyPI today (the rest of the
    # 2.x line is 2.0.0a1..2.0.0rc1, prereleases uv excludes by default), so the
    # ceiling is a real (if currently degenerate) boundary rather than a guess —
    # it becomes load-bearing the moment 2.1 ships.
    "mcp>=2.0.0,<3.0.0",
    # mcp 2.x depends on httpx2, not httpx, and server.py does `import httpx`
    # directly — this explicit declaration is what keeps httpx installed at all.
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/Consiliency/pangram-mcp"
Homepage = "https://github.com/Consiliency/pangram-mcp"
Issues = "https://github.com/Consiliency/pangram-mcp/issues"

[project.scripts]
pangram-mcp = "pangram_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    # tests/test_packaging.py parses pyproject.toml; tomllib is stdlib only on
    # 3.11+, and requires-python allows 3.10, which CI exercises.
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pangram_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
